<!doctype html>
<html lang="en" class="dark" style="background-color: #0b090f; color: #f2edf7;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MONA - Meet Someone Who Understands You</title>
    <meta name="description" content="Discover AI companions who can talk with you, understand your mood, remember your moments and be there whenever you want someone to talk to." />
    <meta property="og:title" content="MONA - Meet Someone Who Understands You" />
    <meta property="og:description" content="Discover AI companions who can talk with you, understand your mood, remember your moments and be there whenever you want someone to talk to." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    <style>
      @keyframes mona-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes mona-pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
    </style>
    <script>
      // Fallback in case of script loading failures on GitHub Pages
      function showScriptError(msg) {
        var loader = document.getElementById('initial-loader');
        if (loader) {
          loader.innerHTML = '<div style="max-width:400px; margin:0 auto; padding:24px; background:#161222; border:1px solid rgba(244,63,94,0.4); border-radius:16px; text-align:center;">' +
            '<div style="font-size:18px; font-weight:bold; color:#fda4af; margin-bottom:8px;">App Loading Failed</div>' +
            '<p style="font-size:12px; color:#a1a1aa; line-height:1.5; margin-bottom:16px;">' +
            (msg || 'The compiled bundle could not be loaded. Please ensure the GitHub Actions build completed.') +
            '</p>' +
            '<button onclick="location.reload()" style="padding:8px 20px; background:#e11d48; color:#fff; border:none; border-radius:10px; cursor:pointer; font-size:12px; font-weight:600;">Reload App</button>' +
            '</div>';
        }
      }

      window.addEventListener('error', function (e) {
        if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          showScriptError('Failed to load JavaScript bundle (' + (e.target.src || 'script') + ').');
        }
      }, true);

      window.addEventListener('unhandledrejection', function (e) {
        showScriptError(e.reason && e.reason.message ? e.reason.message : 'Application initialization rejected.');
      });
    </script>
  </head>
  <body style="background-color: #0b090f; color: #f2edf7; margin: 0; min-height: 100vh;" class="bg-[#0b090f] text-[#f2edf7] font-sans antialiased selection:bg-rose-600/30 selection:text-rose-200">
    <div id="root">
      <div id="initial-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0b090f; color: #f2edf7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 24px;">
        <div style="width: 48px; height: 48px; border-radius: 50%; border: 3px solid rgba(244,63,94,0.15); border-top-color: #f43f5e; animation: mona-spin 0.9s linear infinite; margin-bottom: 20px;"></div>
        <div style="font-size: 22px; font-weight: 700; letter-spacing: 0.2em; color: #fda4af; margin-bottom: 6px; font-family: serif;">MONA</div>
        <div style="font-size: 13px; color: #71717a; animation: mona-pulse 2s ease-in-out infinite;">Meet Someone Who Understands You</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
